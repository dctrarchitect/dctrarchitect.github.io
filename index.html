<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DART Architecture</title>
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  
  <link rel="icon" type="image/svg+xml" href="assets/logo/dartlogotitle.svg?v=2">
  <link rel="apple-touch-icon" href="assets/logo/dartlogotitle.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    html {
      background-color: #121212;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-color: #f5f5f7;
      --text-color: #121212;
      --header-bg: #121212;
    }
    body {
      /* Sol ve sağ kenarlarda siyah, ortada geniş beyaz alan */
      background: linear-gradient(
        to right,
        #121212 0%,
        #121212 4%,
        var(--bg-color) 24%,
        var(--bg-color) 76%,
        #121212 96%,
        #121212 100%
      );
      color: var(--text-color);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ÜST HEADER */
    .site-header {
      background-color: var(--header-bg);
      color: #f5f5f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 48px;
      flex: 0 0 48px;
      padding: 0 80px;
      width: 100%;
      position: relative;
      z-index: 100;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      z-index: 2;
    }
    
    .header-left .top-logo {
      height: 48px;
      width: auto;
      display: block;
    }
    
    .header-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 1;
      white-space: nowrap;
    }
    
    .header-center a {
      color: inherit;
      text-decoration: none;
    }

    .header-center h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 2;
    }
    
    .header-right a {
      color: #f5f5f7;
      font-size: 16px;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    
    .header-right a:hover {
      opacity: 0.6;
    }

    /* HAMBURGER MENÜ */
    .hamburger-btn {
      display: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      z-index: 1000;
    }

    .mobile-menu-overlay {
      position: absolute;
      top: 48px; 
      left: 0;
      width: 100%;
      background-color: #000000;
      z-index: 999;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.4s ease-in-out;
    }

    .mobile-menu-overlay.active {
      max-height: 250px;
      border-top: 1px solid #222;
    }

    .mobile-menu-overlay a {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      margin: 0 24px;
      padding: 16px 0;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      border-bottom: 1px solid #222;
      transition: opacity 0.2s ease;
      text-align: center;
    }
    
    .mobile-menu-overlay a:first-child { margin-top: 8px; }
    .mobile-menu-overlay a:last-child { border-bottom: none; margin-bottom: 12px; }
    .mobile-menu-overlay a:hover { opacity: 0.6; }

    /* ANA SAHNE */
    .home-stage {
      flex: 1;
      width: 100%;
      height: calc(100dvh - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(48px, 7vw, 130px);
      padding: 0 40px;
      position: relative;
    }

    /* KARAKTERLER */
    .character-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      pointer-events: none;
    }

    .character-slot img {
      height: 58vh;
      max-height: 620px;
      width: auto;
      object-fit: contain;
      display: block;
      transition: transform 0.35s ease;
    }

    /* MERKEZ LOGO VE NAVİGASYON */
    .center-hub {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      perspective: 900px; /* 3D dönüş derinliği */
    }

    .brand-emblem {
      width: 190px;
      height: auto;
      margin-bottom: 36px;
      display: block;
      /* Beklerken kendi dikey ekseninde yavaşça döner */
      animation: idleSpinY 9s linear infinite;
      transform-style: preserve-3d;
    }

    .brand-emblem:hover {
      animation-play-state: paused;
    }

    @keyframes idleSpinY {
      0% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(360deg);
      }
    }

    /* Düz 2D saat yönünde dönüş istersen üstteki keyframes yerine bunu kullan:
    @keyframes idleSpinY {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    */

    .main-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .main-nav a {
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #7a7a7a;
      transition: color 0.25s ease, transform 0.25s ease;
    }

    .main-nav a:hover {
      color: #121212;
      transform: scale(1.04);
    }

    /* MOBİL EKRAN KURALLARI */
    @media (max-width: 768px) {
      .desktop-menu { display: none !important; }
      .hamburger-btn { display: block; position: absolute; right: 16px; }
      .site-header { padding: 0 16px; }
      .header-left .top-logo { height: 38px; }
      .header-center h1 { font-size: 11px; letter-spacing: 0.1em; }

      body {
        background: var(--bg-color);
      }

      .home-stage {
        flex-direction: column;
        justify-content: center;
        padding: 24px 20px;
      }

      /* Mobilde karakterleri gizle */
      .character-slot {
        display: none !important;
      }

      .center-hub {
        margin: 0;
      }

      .brand-emblem {
        width: 150px;
        margin-bottom: 32px;
      }

      .main-nav {
        gap: 22px;
      }

      .main-nav a {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <a href="./" aria-label="Main Page">
        <img src="assets/logo/dartlogoheader.svg?v=3" alt="Dart Logo" class="top-logo">
      </a>
    </div>
    
    <div class="header-center">
      <a href="./" aria-label="Main Page">
        <h1>DART Architecture</h1>
      </a>
    </div>

    <div class="header-right desktop-menu">
      <a href="https://instagram.com/dctrart/" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="mailto:info@dctrart.com" aria-label="Email"><i class="fa-regular fa-envelope"></i></a>
      <a href="https://sketch.dctrart.com" target="_blank" aria-label="Dart Sketchbook"><i class="fa-solid fa-pen-nib"></i></a>
    </div>

    <div class="hamburger-btn" onclick="toggleMobileMenu()">
      <i class="fa-solid fa-bars"></i>
    </div>
  </header>

  <div class="mobile-menu-overlay" id="mobileMenu">
    <a href="https://instagram.com/dctrart/" target="_blank">Instagram</a>
    <a href="mailto:info@dctrart.com">İletişim</a>
    <a href="https://sketch.dctrart.com" target="_blank">Dart Sketchbook</a>
  </div>

  <main class="home-stage">
    <!-- SOL KARAKTER -->
    <div class="character-slot left">
      <img src="assets/icon/char-left.svg" alt="Left Character">
    </div>

    <!-- MERKEZ: DÖNEN LOGO VE SAYFA LİNKLERİ -->
    <div class="center-hub">
      <img src="assets/logo/dartlogoblack.svg" alt="DART Emblem" class="brand-emblem">
      
      <nav class="main-nav">
        <a href="projects/">Projects</a>
        <a href="solutions/">Solutions</a>
        <a href="marketing/">Marketing</a>
        <a href="https://sketch.dctrart.com">Sketchbook</a>
      </nav>
    </div>

    <!-- SAĞ KARAKTER -->
    <div class="character-slot right">
      <img src="assets/icon/char-right.svg" alt="Right Character">
    </div>
  </main>

<script>
  function toggleMobileMenu() {
    const menu = document.getElementById('mobileMenu');
    menu.classList.toggle('active');
  }
</script>

</body>
</html>
