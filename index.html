<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DART Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-color: #f5f5f7;
      --text-color: #121212;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .logo-container {
      max-width: 260px;
      width: 55%;
      margin-bottom: 24px;
      transition: transform 0.3s ease;
    }
    .logo-container:hover {
      transform: scale(1.02);
    }
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .tagline {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.75;
    }
    .contact-link {
      margin-top: 36px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-decoration: none;
      color: var(--text-color);
      border-bottom: 1px solid var(--text-color);
      padding-bottom: 3px;
      transition: opacity 0.2s ease;
    }
    .contact-link:hover {
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img src="dartlogocns.svg" alt="DART Architecture">
  </div>
  
  <h1 class="brand-title">DART Architecture</h1>
  <p class="tagline">Architecture & Spatial Design</p>

  <a href="mailto:info@dctrart.com" class="contact-link">info@dctrart.com</a>

</body>
</html>
