<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DART Architecture - Solutions</title>
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  
  <link rel="icon" type="image/svg+xml" href="../assets/logo/dartlogocons.svg?v=2">
  <link rel="apple-touch-icon" href="../assets/logo/dartlogocons.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    html {
      background-color: #121212;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-color: #f5f5f7;
      --text-color: #121212;
      --header-bg: #121212;
    }
    body {
      /* Sağ %40 siyah, sola doğru beyaz alana geçiş */
      background: linear-gradient(to left, #121212 0%, #121212 40%, var(--bg-color) 70%);     
      color: var(--text-color);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ÜST HEADER */
    .site-header {
      background-color: var(--header-bg);
      color: #f5f5f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 48px;
      flex: 0 0 48px;
      padding: 0 80px;
      width: 100%;
      position: relative;
      z-index: 100;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      z-index: 2;
    }
    
    .header-left .top-logo {
      height: 48px;
      width: auto;
      display: block;
    }
    
    .header-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 1;
      white-space: nowrap;
    }
    
    .header-center a {
      color: inherit;
      text-decoration: none;
    }

    .header-center h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 2;
    }
    
    .header-right a {
      color: #f5f5f7;
      font-size: 16px;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    
    .header-right a:hover {
      opacity: 0.6;
    }

    /* HAMBURGER MENÜ */
    .hamburger-btn {
      display: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      z-index: 1000;
    }

    .mobile-menu-overlay {
      position: absolute;
      top: 48px; 
      left: 0;
      width: 100%;
      background-color: #000000;
      z-index: 999;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.4s ease-in-out;
    }

    .mobile-menu-overlay.active {
      max-height: 250px;
      border-top: 1px solid #222;
    }

    .mobile-menu-overlay a {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      margin: 0 24px;
      padding: 16px 0;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      border-bottom: 1px solid #222;
      transition: opacity 0.2s ease;
      text-align: center;
    }
    
    .mobile-menu-overlay a:first-child { margin-top: 8px; }
    .mobile-menu-overlay a:last-child { border-bottom: none; margin-bottom: 12px; }
    .mobile-menu-overlay a:hover { opacity: 0.6; }

    /* SOLUTIONS İÇERİK DÜZENİ (MASAÜSTÜ - MİRROR) */
    .solutions-container {
      flex: 1;
      display: flex;
      flex-direction: row-reverse; /* Listeyi sağa, vitrini sola alır */
      width: 100%;
      height: calc(100dvh - 48px);
      min-height: 0;
      overflow: hidden;
    }

    .solutions-sidebar {
      width: 40%;
      height: 100%;
      display: block;
      padding: 80px 100px 0px 100px;
      text-align: left; /* Metinler sağ kolonda sola yaslı kalır */
      overflow-y: auto;
      overscroll-behavior: contain;
      direction: ltr; /* Scrollbar ekranın en sağ kenarında durur */
    }
    .solutions-sidebar::-webkit-scrollbar {
      width: 4px;
    }
    .solutions-sidebar::-webkit-scrollbar-track {
      background: transparent;
    }
    .solutions-sidebar::-webkit-scrollbar-thumb {
      background-color: #333333; 
      border-radius: 10px;
    }

    .solution-item {
      cursor: pointer;
      transition: opacity 0.3s ease;
      opacity: 0.5;
      margin-bottom: 70px;
    }
    .solution-item:last-child {
      margin-bottom: 50vh;
    }
    .solution-item:hover, .solution-item.active {
      opacity: 1;
    }
    .solution-item h2 {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
      transition: font-size 0.3s ease;
    }
    .solution-item.active h2, 
    .solution-item:hover h2 {
      font-size: 24px;
    }
    .solution-item p {
      font-size: 11px;
      color: #999999;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    
    /* SOL VİTRİN */
    .solution-viewer {
      width: 60%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .solution-viewer::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0; /* Geçiş gradyanı sağ taraftaki siyah panele bitişik */
      left: auto;
      width: 300px;
      height: 100%;
      background: linear-gradient(to left, #121212 0%, rgba(18, 18, 18, 0.75) 40%, transparent 70%);
      z-index: 10; 
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .solution-viewer.has-logo::after {
      opacity: 0;
    }

    .solution-viewer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: left center;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      opacity: 1;
      transition: opacity 0.25s ease-in-out;
    }
    
    .solution-viewer img.is-idle {
      object-fit: contain;
      object-position: center;
      width: auto !important;
      height: 72vh !important;
      max-width: none !important; 
      max-height: none !important;
      top: 50%;
      left: 25% !important; /* Sol beyaz alanın tam ortası */
      right: auto;
      transform: translate(-50%, -50%);
      opacity: 0.95;
    }

    .solution-viewer img.is-logo {
      object-fit: contain;
      object-position: center;
      width: auto !important;
      height: auto !important;
      max-width: 35% !important;
      max-height: 45% !important;
      top: 50%;
      left: 25% !important; /* Sol beyaz alanın tam ortası */
      right: auto;
      transform: translate(-50%, -50%);
      opacity: 0.85;
    }

    .solution-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-in-out, margin-top 0.4s ease;
      margin-top: 0;
    }
    .solution-item.active .solution-details {
      max-height: 300px;
      margin-top: 16px;
    }
    .sub-menu {
      list-style: none;
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }
    .sub-menu li {
      font-size: 11px;
      color: #777;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.2s ease;
    }
    .sub-menu li:hover, 
    .sub-menu li.sub-active {
      color: #f5f5f7;
    }
    .content-display {
      font-size: 12px;
      color: #aaa;
      line-height: 1.5;
    }
    .scroll-arrow {
      display: none;
    }

    /* MOBİL EKRAN KURALLARI (PROJECTS İLE AYNI) */
    @media (max-width: 768px) {
      .desktop-menu { display: none !important; }
      .hamburger-btn { display: block; position: absolute; right: 16px; }
      .site-header { padding: 0 16px; }
      .header-left .top-logo { height: 38px; }
      .header-center h1 { font-size: 11px; letter-spacing: 0.1em; }

      body {
        background: #121212;
        overflow: auto;
        height: 100dvh;
      }

      .solutions-container {
        flex-direction: column-reverse !important;
        height: calc(100dvh - 48px);
      }

      .solution-viewer {
        width: 100% !important;
        height: 45vh !important;
        flex: 0 0 45vh !important;
        background-color: #f5f5f7 !important;
        position: relative !important;
      }

      /* Mobilde her zaman altta kalan 20px geçiş gradyanı */
      .solution-viewer::after {
        content: '';
        position: absolute;
        bottom: 0 !important;
        top: auto !important;
        left: 0 !important;
        right: auto !important;
        width: 100% !important;
        height: 20px !important;
        background: linear-gradient(to bottom, transparent, rgba(18, 18, 18, 0.9)) !important;
        z-index: 5 !important;
        pointer-events: none !important;
        display: block !important;
        opacity: 1 !important;
      }

      .solution-viewer img.is-idle {
        width: auto !important;
        height: 75% !important;
        max-width: 90% !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        object-fit: contain;
      }

      .solution-viewer img.is-logo {
        width: auto !important;
        height: auto !important;
        max-width: 50% !important;
        max-height: 50% !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        object-fit: contain;
      }

      .solutions-sidebar {
        width: 100% !important;
        height: 55vh !important;
        flex: 1 !important;
        padding: 24px 20px !important;
        background-color: #121212 !important;
        direction: ltr !important;
        overflow-y: auto !important;
      }

      .solutions-sidebar::-webkit-scrollbar { width: 3px; }

      .solution-item {
        display: none !important;
        margin-bottom: 0 !important;
      }

      .solution-item.active {
        display: flex !important;
        flex-direction: column !important;
        height: 100% !important;
      }

      .solution-item.active h2 {
        border-bottom: 1px solid #f5f5f7;
        padding-bottom: 8px;
        margin-bottom: 12px;
        font-size: 20px;
      }

      .solution-item.active .solution-details {
        max-height: none !important;
        flex: 1 !important;
        overflow-y: auto !important;
        margin-top: 10px;
      }

      .solutions-sidebar:not(:has(.solution-item.active)) .solution-item {
        display: block !important;
        margin-bottom: 35px !important;
      }

      /* Alt menü ok kaydırma sistemi */
      .solution-item.active .sub-menu-container {
        display: flex;
        align-items: center;
        position: relative;
        margin-bottom: 12px;
      }

      .solution-item.active .sub-menu {
        display: flex;
        overflow-x: auto;
        scroll-behavior: smooth;
        gap: 20px;
        white-space: nowrap;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding: 4px 28px;
        list-style: none;
        width: 100%;
      }

      .solution-item.active .sub-menu::-webkit-scrollbar { display: none; }

      .solution-item.active .sub-menu li {
        flex: 0 0 auto;
        font-size: 11px;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
      }

      .solution-item.active .sub-menu li.sub-active {
        color: #f5f5f7;
        font-weight: 600;
      }

      .scroll-arrow {
        display: block;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: #f5f5f7;
        font-size: 14px;
        cursor: pointer;
        z-index: 10;
        padding: 4px 8px;
        opacity: 0.7;
      }
      .scroll-arrow.left { left: 0; }
      .scroll-arrow.right { right: 0; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <a href="../" aria-label="Main Page">
        <img src="../assets/logo/dartlogoheader.svg?v=3" alt="Dart Logo" class="top-logo">
      </a>
    </div>
    
    <div class="header-center">
      <a href="../" aria-label="Main Page">
        <h1>DART Architecture</h1>
      </a>
    </div>

    <div class="header-right desktop-menu">
      <a href="https://instagram.com/dctrart/" target="_blank" aria-label="Instagram"><i class="
