<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DART Architecture</title>
  <link rel="icon" type="image/svg+xml" href="dartlogocons.svg?v=2">
  <link rel="apple-touch-icon" href="dartlogocons.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-color: #f5f5f7;
      --text-color: #121212;
      --header-bg: #000000;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ÜST HEADER (SİYAH ŞERİT) - KUSURSUZ GRID SİSTEMİ */
    .site-header {
      background-color: var(--header-bg);
      color: #f5f5f7;
      display: grid;
      grid-template-columns: 1fr auto 1fr; /* Sol (esnek), Orta (sabit merkez), Sağ (esnek) */
      align-items: center;
      height: 48px;
      padding: 0 80px; /* Kenarlardan genel boşluk, logoyu ve ikonları içeri alır */
      width: 100%;
    }
    
    .header-left {
      justify-self: start;
      display: flex;
      align-items: center;
    }
    
    .header-left .top-logo {
      height: 48px;
      width: auto;
      display: block;
    }
    
    .header-center {
      justify-self: center; /* Yazıyı şeridin KESİN merkezine kilitler */
      text-align: center;
    }
    
    .header-center h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    
    .header-center span {
      font-size: 12px;
      color: #999;
      letter-spacing: 0.1em;
    }
    
    .header-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    
    .header-right a {
      color: #f5f5f7;
      font-size: 16px;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    
    .header-right a:hover {
      opacity: 0.6;
    }

    /* ANA İÇERİK ALANI */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .logo-container {
      max-width: 260px;
      width: 55%;
      margin-bottom: 24px;
      transition: transform 0.3s ease;
    }
    
    .logo-container:hover {
      transform: scale(1.02);
    }
    
    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    
    .tagline {
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.75;
    }
    
    .contact-link {
      margin-top: 36px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-decoration: none;
      color: var(--text-color);
      border-bottom: 1px solid var(--text-color);
      padding-bottom: 3px;
      transition: opacity 0.2s ease;
    }
    
    .contact-link:hover {
      opacity: 0.5;
    }

    /* MOBİL EKRANLAR İÇİN DÜZELTMELER - HER ZAMAN EN ALTTA OLMALIDIR */
    @media (max-width: 768px) {
      .site-header {
        padding: 0 16px; /* Mobilde 80px olan kenar boşluğu sıfırlanıp 16px'e çekilir */
      }
      .header-left .top-logo {
        height: 48px; /* Logo küçültülür */
      }
      .header-center h1 {
        font-size: 10px;
        letter-spacing: 0.1em;
      }
      .header-center span {
        display: none; 
      }
      .header-right {
        gap: 10px; /* İkon boşlukları daraltılır */
      }
      .header-right a {
        font-size: 14px; /* İkon boyutları küçültülür */
      }
    }
  </style>
</head>
<body>

  <!-- ÜST ŞERİT (HEADER) -->
  <header class="site-header">
    <div class="header-left">
      <img src="dartlogoheader.svg" alt="Dart Logo" class="top-logo">
    </div>
    <div class="header-center">
      <h1>DART Architecture</h1>
    </div>
    <div class="header-right">
      <a href="https://instagram.com/dctrart/" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="mailto:info@dctrart.com" aria-label="Email"><i class="fa-regular fa-envelope"></i></a>
      <a href="https://blog.dctrart.com" aria-label="Dart Blog">
      <a img src="dartlogoblog.svg" alt="Blog" style="height: 48px; width: auto; filter: invert(1);"> 
        </a>
    </div>
  </header>

  <!-- ANA İÇERİK -->
  <main class="main-content">
    <div class="logo-container">
      <img src="dartlogocons.svg" alt="DART Architecture">
    </div>
    
    <h1 class="brand-title">We will be at your service very soon</h1>
    <p class="tagline">Architecture & Spatial Design</p>

    <a href="mailto:info@dctrart.com" class="contact-link">info@dctrart.com</a>
  </main>

</body>
</html>
